<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licitaciones Fotocopiadoras</title>
<style>
:root{
  --bg:#f6f4f1; --card:#ffffff; --ink:#1f1b16; --muted:#6b645b; --line:#e6e1da;
  --accent:#c2410c; --accent-ink:#ffffff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --chip:#f1ede7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16130f; --card:#201c17; --ink:#f1ece4; --muted:#a39a8d; --line:#35302a;
         --accent:#f97316; --accent-ink:#1a1209; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#93c5fd; --chip:#2a251f; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}
header h1 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--chip);border:1px solid var(--line);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.55;cursor:wait}
main{max-width:1250px;margin:0 auto;padding:16px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.stat b{font-size:24px;display:block}
.stat span{color:var(--muted);font-size:12px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.filters input,.filters select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.filters .chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink);padding-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .ent{font-weight:600}
.card .desc{color:var(--ink);grid-column:1}
.card .meta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;grid-column:1}
.card .side{grid-row:1 / span 3;grid-column:2;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.money{font-weight:700;font-size:17px;white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);white-space:nowrap}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.bad{color:var(--bad)} .badge.info{color:var(--info)}
.badge.nueva{background:var(--accent);color:var(--accent-ink)}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
@media(max-width:640px){.card{grid-template-columns:1fr}.card .side{grid-row:auto;grid-column:1;flex-direction:row;justify-content:space-between;align-items:center;width:100%}}
/* detalle */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:18px;z-index:10;display:none}
.drawer h2{margin:0 0 4px;font-size:18px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.sec h3{margin:0 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr.now td{background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px}
pre.log{background:#0e0c0a;color:#d6d0c6;padding:10px;border-radius:8px;max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap}
a{color:var(--info)}
</style>
</head>
<body>
<header>
  <h1>Licitaciones de fotocopiadoras<small>Fuente: SEACE (OECE) · <span id="estadoTxt">…</span></small></h1>
  <button class="btn" id="btnLog">Registro</button>
  <a class="btn" id="btnXls" href="#" style="text-decoration:none;color:inherit">Exportar Excel</a>
  <button class="btn primary" id="btnScrape">Buscar nuevas ahora</button>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <label>Buscar<input id="fq" placeholder="entidad, descripción…" size="22"></label>
    <label>Entidad<input id="fentidad" size="16"></label>
    <label>Monto mín.<input id="fmin" type="number" min="0" style="width:105px"></label>
    <label>Monto máx.<input id="fmax" type="number" min="0" style="width:105px"></label>
    <label>Estado
      <select id="festado"><option value="">Todos</option><option>nueva</option><option>interesante</option><option>postulada</option><option>descartada</option></select></label>
    <label>Ordenar
      <select id="forden"><option value="publicacion">Más recientes</option><option value="cierre_asc">Cierre más próximo</option><option value="cierre">Cierre más lejano</option><option value="monto">Mayor monto</option><option value="entidad">Entidad A-Z</option></select></label>
    <label class="chk"><input type="checkbox" id="fabiertas"> Solo abiertas</label>
    <label class="chk"><input type="checkbox" id="frel" checked> Solo relevantes</label>
  </div>
  <div id="list"></div>
  <div id="logbox" style="display:none" class="sec"><h3>Registro de actividad</h3><pre class="log" id="logtxt"></pre><div id="corridas"></div></div>
</main>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (v, m) => v == null ? '<span style="color:var(--muted);font-weight:400">VR no indicado</span>' : (m === 'Soles' ? 'S/ ' : (m||'') + ' ') + Number(v).toLocaleString('es-PE', {minimumFractionDigits: 2});
const fdate = s => { if(!s) return '—'; const [d,t] = s.split(' '); const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}` + (t && t!=='00:00' ? ' '+t : ''); };

function cierreBadge(l){
  if(!l.cierre_propuestas) return l.ficha_ok ? '' : '<span class="badge">sin cronograma</span>';
  const ms = new Date(l.cierre_propuestas.replace(' ','T')) - new Date();
  const dias = Math.ceil(ms / 86400000);
  if(ms < 0) return `<span class="badge bad">cerrada ${fdate(l.cierre_propuestas)}</span>`;
  if(dias <= 3) return `<span class="badge warn">cierra en ${dias} d · ${fdate(l.cierre_propuestas)}</span>`;
  return `<span class="badge ok">cierra en ${dias} d · ${fdate(l.cierre_propuestas)}</span>`;
}

function params(){
  const p = new URLSearchParams();
  const m = {q:'#fq', entidad:'#fentidad', vr_min:'#fmin', vr_max:'#fmax', estado:'#festado', orden:'#forden'};
  for(const k in m){ const v = $(m[k]).value.trim(); if(v) p.set(k, v); }
  if($('#fabiertas').checked) p.set('abiertas','true');
  p.set('relevante', $('#frel').checked ? 'true' : 'false');
  return p;
}

async function load(){
  const r = await (await fetch('/api/licitaciones?' + params())).json();
  const s = r.stats || {};
  $('#stats').innerHTML = [
    ['Total relevantes', s.total||0, ''], ['Abiertas ahora', s.abiertas||0, 'abiertas'],
    ['Nuevas sin revisar', s.nuevas||0, 'nueva'], ['Marcadas interesantes', s.interesantes||0, 'interesante']
  ].map(([t,n,f]) => `<div class="stat" data-f="${f}"><b>${n}</b><span>${t}</span></div>`).join('');
  document.querySelectorAll('.stat').forEach(e => e.onclick = () => {
    const f = e.dataset.f;
    if(f === 'abiertas') $('#fabiertas').checked = !$('#fabiertas').checked;
    else if(f) $('#festado').value = $('#festado').value === f ? '' : f;
    else { $('#fabiertas').checked = false; $('#festado').value = ''; }
    load();
  });
  $('#btnXls').href = '/api/export.xlsx?' + params();
  $('#list').innerHTML = r.items.length ? r.items.map(l => `
    <div class="card" data-id="${esc(l.nid_proceso)}">
      <div class="ent">${esc(l.entidad)} ${l.estado_seg === 'nueva' ? '<span class="badge nueva">NUEVA</span>' : ''}</div>
      <div class="desc">${esc(l.descripcion)}</div>
      <div class="meta"><span>${esc(l.nomenclatura)}</span><span>Publicada ${fdate(l.fecha_publicacion)}</span>
        ${l.n_docs ? `<span>${l.n_docs} documentos</span>` : ''}${l.nota ? `<span>📝 ${esc(l.nota.slice(0,50))}</span>` : ''}</div>
      <div class="side"><div class="money">${money(l.valor_referencial, l.moneda)}</div>${cierreBadge(l)}
        ${l.estado_seg !== 'nueva' ? `<span class="badge info">${esc(l.estado_seg)}</span>` : ''}</div>
    </div>`).join('') : '<div class="empty">Sin resultados. Prueba otros filtros o pulsa “Buscar nuevas ahora”.</div>';
  document.querySelectorAll('.card').forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

async function openDetail(id){
  const l = await (await fetch('/api/licitaciones/' + encodeURIComponent(id))).json();
  const now = new Date();
  const f = l.ficha || {};
  const crono = l.cronograma.map(c => {
    const a = c.inicio && new Date(c.inicio.replace(' ','T')), b = c.fin && new Date(c.fin.replace(' ','T'));
    const vigente = a && b && a <= now && now <= b;
    return `<tr class="${vigente?'now':''}"><td>${esc(c.etapa)}${vigente?' ◀ vigente':''}</td><td>${fdate(c.inicio)}</td><td>${fdate(c.fin)}</td></tr>`;
  }).join('');
  const docs = l.documentos.map(d => `<tr><td>${esc(d.documento)}<br><small style="color:var(--muted)">${esc(d.etapa)} · ${esc(d.tamano)} · ${fdate(d.fecha)}</small></td>
     <td style="text-align:right">${d.local_path ? `<a href="/api/documentos/${d.id}" target="_blank">Abrir PDF</a>` : '<span style="color:var(--muted)">no descargado</span>'}</td></tr>`).join('');
  $('#drawer').innerHTML = `
    <div class="row"><button class="btn" onclick="closeDrawer()">← Cerrar</button></div>
    <h2>${esc(l.entidad)}</h2>
    <div style="color:var(--muted)">${esc(l.nomenclatura)} · RUC ${esc(l.ruc || '—')}</div>
    <div class="sec"><h3>Objeto</h3>${esc(l.descripcion)}
      <div class="row"><span class="badge">${esc(l.objeto)}</span><span class="money">${money(l.valor_referencial, l.moneda)}</span>${cierreBadge(l)}</div>
      <div style="color:var(--muted);font-size:13px">Publicada ${fdate(l.fecha_publicacion)} · ${esc(f['Tipo Compra o Selección'] || '')} ${esc(f['Normativa Aplicable'] || '')}</div>
      ${f['Direccion Legal'] ? `<div style="color:var(--muted);font-size:13px">📍 ${esc(f['Direccion Legal'])}</div>` : ''}</div>
    <div class="sec"><h3>Seguimiento</h3>
      <div class="row" id="estbtns">${['interesante','postulada','descartada','nueva'].map(e => `<button class="btn ${l.estado_seg===e?'primary':''}" data-e="${e}">${e}</button>`).join('')}</div>
      <textarea id="nota" placeholder="Notas (contacto, precio a ofertar, etc.)">${esc(l.nota || '')}</textarea>
      <div class="row"><button class="btn" id="saveNota">Guardar nota</button></div></div>
    <div class="sec"><h3>Cronograma</h3><table><tr><th>Etapa</th><th>Inicio</th><th>Fin</th></tr>${crono || '<tr><td colspan=3>Sin cronograma</td></tr>'}</table></div>
    <div class="sec"><h3>Documentos</h3><table>${docs || '<tr><td>Sin documentos</td></tr>'}</table>
      ${l.documentos.length ? '<div class="row"><button class="btn primary" id="dl">Descargar bases y documentos</button></div><small style="color:var(--muted)">Se abre Chrome y los baja desde SEACE (puede tardar).</small>' : ''}</div>`;
  $('#drawer').style.display = 'block'; $('#shade').style.display = 'block';
  document.querySelectorAll('#estbtns button').forEach(b => b.onclick = async () => {
    await fetch(`/api/licitaciones/${encodeURIComponent(id)}/estado`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({estado: b.dataset.e})});
    openDetail(id); load();
  });
  $('#saveNota').onclick = async () => {
    await fetch(`/api/licitaciones/${encodeURIComponent(id)}/estado`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({nota: $('#nota').value})});
    $('#saveNota').textContent = 'Guardada ✓'; load();
  };
  if($('#dl')) $('#dl').onclick = async () => {
    const r = await fetch(`/api/licitaciones/${encodeURIComponent(id)}/descargar`, {method:'POST'});
    $('#dl').textContent = r.ok ? 'Descargando… (revisa el Registro)' : 'Hay otra tarea en curso'; $('#dl').disabled = true;
    pollEstado();
  };
}
function closeDrawer(){ $('#drawer').style.display = 'none'; $('#shade').style.display = 'none'; }
$('#shade').onclick = closeDrawer;

async function pollEstado(){
  const r = await (await fetch('/api/estado')).json();
  const t = r.tarea;
  $('#estadoTxt').textContent = t.corriendo ? `⏳ ${t.tarea} en curso…` : (r.proxima ? 'próxima búsqueda automática: ' + r.proxima.slice(0,16) : 'inactivo');
  $('#btnScrape').disabled = t.corriendo;
  $('#logtxt').textContent = r.log.join('\n') || '(sin actividad desde que inició el servidor)';
  $('#corridas').innerHTML = '<table><tr><th>Inicio</th><th>Palabra</th><th>Año</th><th>Enc.</th><th>Nuevas</th><th>Estado</th></tr>' +
    r.corridas.map(c => `<tr><td>${esc(c.inicio)}</td><td>${esc(c.palabra)}</td><td>${c.anio}</td><td>${c.encontradas}</td><td>${c.nuevas}</td><td>${esc(c.estado)}${c.error ? ' ⚠ ' + esc(c.error.slice(0,80)) : ''}</td></tr>`).join('') + '</table>';
  if(t.corriendo){ setTimeout(pollEstado, 3000); } else if(window.__wasRunning){ window.__wasRunning = false; load(); }
  if(t.corriendo) window.__wasRunning = true;
}

$('#btnScrape').onclick = async () => {
  const r = await fetch('/api/scrape', {method:'POST'});
  if(!r.ok) alert('Ya hay una tarea en curso');
  $('#logbox').style.display = 'block'; pollEstado();
};
$('#btnLog').onclick = () => { const b = $('#logbox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; pollEstado(); };
let tm; ['#fq','#fentidad','#fmin','#fmax'].forEach(s => $(s).oninput = () => { clearTimeout(tm); tm = setTimeout(load, 300); });
['#festado','#forden','#fabiertas','#frel'].forEach(s => $(s).onchange = load);
load(); pollEstado();
</script>
</body>
</html>
